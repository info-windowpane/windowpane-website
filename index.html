<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windowpane</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* ===== Base Page ===== */
  html, body {
    margin: 0;
    padding: 0;
    background: white;
    height: 100%;
    width: 100%;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ===== Top Menu Bar ===== */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 20px;
    background: white;
  }

  /* Windowpane Title */
  .top-bar .title {
    font-family: 'Baskerville', serif;
    font-weight: 600; 
    letter-spacing: 20px;
    font-size: 1rem; 
    color: black;
  }

  /* Info and Previous Links */
  .top-bar .info-link,
  .top-bar .previous-link {
    margin-left: 40px; 
    font-family: Arial, sans-serif;
    font-size: 0.70rem;
    color: black;
  }

  /* General link styling for top bar */
  .top-bar a {
    text-decoration: none;
    color: inherit;
  }

  /* ===== Grid Wrapper ===== */
  .grid-wrapper {
    flex: 1;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 5px; 
  }

  /* ===== Grid Layout ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, auto);
    width: 100%;
    max-height: auto;
    gap: 5px;
    background: white;
  }

  /* ===== Grid Cells ===== */
  .cell {
    overflow: hidden;
    background: white;
  }

  .cell img {
    width: 100%;
    height: auto;
    aspect-ratio: 768 / 540;
    display: block;
  }

  /* ===== Responsive Design for Mobile ===== */
  @media (max-width: 768px) {
    /* Adjust top bar for smaller screens */
    .top-bar .title {
      letter-spacing: 10px;
    }
    .top-bar .info-link,
    .top-bar .previous-link {
      margin-left: 20px;
    }
    /* Change grid to 2 columns on mobile */
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<!-- Top Menu Bar -->
<div class="top-bar">
  <a href="index.html" class="title">windowpane</a>
  <a href="information.html" class="info-link">Information</a>
  <a href="projects.html" class="previous-link">Projects</a>
</div>

<!-- Grid Container -->
<div class="grid-wrapper">
  <div class="grid" id="grid"></div>
</div>

<script>
  const imageFolder = "projectimages/learning/";

  // Explicit list of 20 windowweb images
  const windowWebImages = [
    "learning_texts.jpg",
    "learning_texts2.jpg",
    "learning_texts3.jpg",
    "learning_texts4.jpg",
    "learning_texts5.jpg",
    "learning_texts6.jpg",
    "learning_texts7.jpg",
    "learning_texts8.jpg",
    "learning_texts9.jpg",
    "learning_texts10.jpg",
    "learning_titles.jpg",
    "learning_titles2.jpg",
    "learning_titles3.jpg",
    "learning_titles4.jpg",
    "learning_titles5.jpg",
    "learning_titles6.jpg",
    "learning_titles7.jpg",
    "learning_titles8.jpg",
    "learning_titles9.jpg",
    "learning_titles10.jpg"

  ];

  /* ===== Shuffle Function ===== */
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const grid = document.getElementById("grid");

  // Shuffle windowweb images
  const shuffledWindowWeb = shuffle([...windowWebImages]);

  // Display all 20 images
  const finalImages = shuffledWindowWeb;
  finalImages.forEach(filename => {
    const cell = document.createElement("div");
    cell.className = "cell";

    const img = document.createElement("img");
    img.src = imageFolder + filename;

    // Add click listener to refresh the page
    img.onclick = function() {
      location.reload();
    }

    cell.appendChild(img);
    grid.appendChild(cell);
  });
</script>

</body>

</html>
